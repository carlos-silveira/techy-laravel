name: Deploy Laravel via Secure HTTP Webhook

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: 🚀 Build, Test & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔐 Security Audit (Secret Detection)
        run: |
          echo "🔍 Scanning codebase for hardcoded secrets..."
          if grep -rEi "PURGED_SECRET|2026Secure|Techy_2026" . --exclude-dir=.git --exclude-dir=docs --exclude=deploy.yml --exclude=test-staging.sh --exclude=AI_ACTIVITY.md; then
            echo "❌ ERROR: Se detectaron rastros de secretos o claves hardcoded!"
            exit 1
          fi
          echo "✅ Auditoría de seguridad pasada."

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 🏗️ Install Dependencies & Build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          # PHP
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs
          
          # Node
          npm install --legacy-peer-deps --prefer-offline --no-audit
          npm run build

      - name: 🐘 Prepare Local Test Environment (SQLite)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          cp .env.example .env
          php artisan key:generate
          
          # Update .env to use SQLite for speed
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          touch database/database.sqlite
          
          php artisan migrate --force
          php artisan db:seed --force || echo "No seeders found or failed"

      - name: 🧪 Run Cypress E2E Smoke Tests
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8000
        run: |
          # Start local PHP server in the background
          php artisan serve --host=127.0.0.1 --port=8000 &
          SERVER_PID=$!
          
          # Wait a few seconds for the server to be ready
          sleep 3
          
          # Run Cypress (no need to reinstall, it was installed by npm install above)
          npx cypress run --spec "cypress/e2e/smoke.cy.js"
          
          # Clean up server
          kill $SERVER_PID

      - name: 📦 Archive Release
        run: |
          # Only zip essential production files and directories. 
          # Excludes public/storage (symlink) and storage logs to keep it lightweight (~20MB).
          zip -r deploy.zip app config database public resources routes scripts vendor bootstrap artisan composer.json composer.lock .htaccess -x "public/storage" "storage/logs/*" "database/database.sqlite"

      - name: 🚀 Transfer & Execute via Secure HTTPS Webhook
        run: |
          # Use curl to upload the zip directly to the Laravel application.
          HTTP_RESPONSE=$(curl -w "%{http_code}" -s -X POST \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Origin: https://techynews.lat" \
            -H "X-Deploy-Token: ${{ secrets.TECHY_DEPLOY_TOKEN }}" \
            -e "https://techynews.lat/" \
            -F "deployFile=@deploy.zip" \
            "https://techynews.lat/_m/ci-cd")
          
          # The response will be JSON with logs. We check for the 200 status code at the end.
          if [[ "$HTTP_RESPONSE" == *200 ]]; then
            echo "✅ Deployment webhook triggered successfully."
            echo "--- REMOTE LOGS ---"
            echo "${HTTP_RESPONSE%200}" | jq -r '.logs' || echo "${HTTP_RESPONSE%200}"
          else
            echo "❌ Deployment failed! HTTP Status: $HTTP_RESPONSE"
            exit 1
          fi

      - name: 🔍 Health Check — Verify Key Pages Return 200
        run: |
          check() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$1")
            if [ "$STATUS" != "200" ]; then
              echo "❌ $1 returned HTTP $STATUS"
              exit 1
            fi
            echo "✅ $1 → $STATUS"
          }
          check https://techynews.lat/
          check https://techynews.lat/about
          check https://techynews.lat/archive
          check https://techynews.lat/login
          check https://techynews.lat/sitemap.xml
          check https://techynews.lat/feed
          check https://techynews.lat/llms.txt
          check "https://techynews.lat/api/search?q=AI"

      - name: 🧩 JS Asset Integrity Check
        run: |
          # Fetch the manifest and verify the main app entry + ArticleShow chunk are accessible.
          MANIFEST=$(curl -s "https://techynews.lat/build/manifest.json")
          APP_FILE=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('resources/js/app.jsx',{}).get('file',''))")
          ARTICLE_FILE=$(echo "$MANIFEST" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('resources/js/Pages/ArticleShow.jsx',{}).get('file',''))")
          
          for ASSET in "$APP_FILE" "$ARTICLE_FILE"; do
            if [ -z "$ASSET" ]; then
              echo "❌ Could not read asset path from manifest"
              exit 1
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://techynews.lat/build/${ASSET}")
            if [ "$STATUS" != "200" ]; then
              echo "❌ JS chunk missing on production: /build/${ASSET} returned $STATUS"
              echo "This means the manifest was deployed but the asset files were not. Rollback required."
              exit 1
            fi
            echo "✅ /build/${ASSET} → $STATUS"
          done

      - name: ⏪ Auto-Rollback on Failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Triggering automatic rollback to previous working version..."
          HTTP_RESPONSE=$(curl -w "%{http_code}" -s -X POST \
            -H "X-Deploy-Token: ${{ secrets.TECHY_DEPLOY_TOKEN }}" \
            "https://techynews.lat/_m/rollback")
          
          if [[ "$HTTP_RESPONSE" == *200 ]]; then
            echo "✅ Rollback successful. The site has been restored."
            echo "${HTTP_RESPONSE%200}" | jq -r '.message' || echo "${HTTP_RESPONSE%200}"
          else
            echo "❌ Rollback failed! Manual intervention required. HTTP Status: $HTTP_RESPONSE"
          fi
